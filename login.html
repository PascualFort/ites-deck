<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - ITES Deck</title>
    <script src="translations.js"></script>
    <style>
      body {
        background: #18181b;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        position: relative;
      }
      .language-switcher {
        position: absolute;
        top: 20px;
        right: 20px;
        display: flex;
        gap: 10px;
      }
      .language-btn {
        background: #27272a;
        border: 1px solid #3f3f46;
        color: #fff;
        padding: 8px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.2s;
      }
      .language-btn:hover {
        background: #3f3f46;
      }
      .language-btn.active {
        background: #6366f1;
        border-color: #6366f1;
      }
      .login-card {
        background: #27272a;
        padding: 2rem 2.5rem;
        border-radius: 1.5rem;
        box-shadow: 0 4px 32px rgba(0, 0, 0, 0.2);
        min-width: 320px;
        text-align: center;
      }
      .login-card h2 {
        margin-bottom: 1.5rem;
        color: #a5b4fc;
      }
      .login-card input[type="password"] {
        width: 100%;
        padding: 0.75rem;
        border-radius: 0.5rem;
        border: none;
        margin-bottom: 1rem;
        font-size: 1rem;
        background: #18181b;
        color: #fff;
      }
      .login-card button {
        width: 100%;
        padding: 0.75rem;
        border-radius: 0.5rem;
        border: none;
        background: #6366f1;
        color: #fff;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
      }
      .login-card button:hover {
        background: #4f46e5;
      }
      .error {
        color: #f87171;
        margin-bottom: 1rem;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div class="language-switcher">
      <button class="language-btn active" data-lang="es">ES</button>
      <button class="language-btn" data-lang="en">EN</button>
    </div>
    <div class="login-card">
      <h2 data-translate="title">Acceso ITES Deck</h2>
      <form id="loginForm">
        <div id="errorMsg" class="error" style="display: none"></div>
        <input
          type="password"
          id="password"
          data-translate="password-placeholder"
          placeholder="Contraseña"
          required
          autocomplete="current-password"
        />
        <button type="submit" data-translate="submit">Entrar</button>
      </form>
    </div>
    <script>
      // Initialize language on page load
      document.addEventListener("DOMContentLoaded", function () {
        updateLanguage(currentLang);

        // Language switcher event listeners
        document.querySelectorAll(".language-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            const lang = btn.getAttribute("data-lang");
            updateLanguage(lang);
          });
        });
      });

      // Login functionality
      const CORRECT_PASSWORD_1 = "hinnerk"; // Hardcoded password
      const CORRECT_PASSWORD_2 = "ites-deck-2025";
      const form = document.getElementById("loginForm");
      const errorMsg = document.getElementById("errorMsg");

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        const pwd = document.getElementById("password").value;
        if (pwd === CORRECT_PASSWORD_1 || pwd === CORRECT_PASSWORD_2) {
          localStorage.setItem("loggedIn", "true");
          const params = new URLSearchParams(window.location.search);
          const redirect = params.get("redirect") || "index.html";
          window.location.href = redirect;
        } else {
          errorMsg.textContent = getTranslation("error-incorrect");
          errorMsg.style.display = "block";
        }
      });
    </script>
  </body>
</html>
